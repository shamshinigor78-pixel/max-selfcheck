  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Мио-фасциальная практика Игоря Шамшина | Москва</title>
  <style>
    :root {
      --bg-main: #fbf9f6; --bg-alt: #f2efe9; --fg: #2b2a28; --muted: #8a8580;
      --accent: #4a8f6f; --accent-hover: #3b755a; --accent-soft: #e8f0ea;
      --card-bg: #ffffff; --border: #ebe6df; --radius: 16px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg-main); color: var(--fg); line-height: 1.6; -webkit-font-smoothing: antialiased; }
    .section { padding: 60px 20px; width: 100%; display: flex; justify-content: center; }
    .section-alt { background-color: var(--bg-alt); }
    .container { width: 100%; max-width: 700px; }
    h1 { font-size: 2.2rem; line-height: 1.2; margin-bottom: 20px; color: var(--fg); }
    h2 { font-size: 1.6rem; margin-bottom: 20px; color: var(--fg); line-height: 1.3; }
    h3 { font-size: 1.2rem; margin-bottom: 10px; color: var(--fg); }
    p { font-size: 1.05rem; margin-bottom: 16px; color: #4a4845; }
    .overline { text-transform: uppercase; letter-spacing: 1px; font-size: 0.8rem; color: var(--accent); font-weight: 700; margin-bottom: 10px; display: block; }
    
    .btn-group { display: flex; flex-direction: column; gap: 12px; margin: 30px 0 15px; }
    .btn { display: flex; align-items: center; justify-content: center; width: 100%; padding: 18px 20px; border-radius: 12px; text-decoration: none; font-weight: 600; font-size: 1.1rem; transition: all 0.2s ease; cursor: pointer; }
    .btn-primary { background: var(--accent); color: #fff; box-shadow: 0 6px 0 var(--accent-hover); transform: translateY(0); }
    .btn-primary:hover { background: var(--accent-hover); transform: translateY(2px); box-shadow: 0 4px 0 var(--accent-hover); }
    .btn-primary:active { transform: translateY(6px); box-shadow: 0 0px 0 var(--accent-hover); }
    
    .btn-outline { background: transparent; color: var(--accent); border: 2px solid var(--accent); box-shadow: 0 6px 0 var(--accent-soft); transform: translateY(0); }
    .btn-outline:hover { background: var(--accent-soft); transform: translateY(2px); box-shadow: 0 4px 0 var(--accent-soft); }
    .btn-outline:active { transform: translateY(6px); box-shadow: 0 0px 0 var(--accent-soft); }
    
    .btn-note { text-align: center; font-size: 0.85rem; color: var(--muted); margin-bottom: 20px; }
    
    .messengers { text-align: center; margin-top: 15px; font-size: 0.95rem; }
    .messengers a { color: var(--accent); text-decoration: underline; margin: 0 5px; font-weight: 600; }
