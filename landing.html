<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Мио-фасциальная практика Игоря Шамшина | Москва</title>
  <meta name="description" content="Авторская мио-фасциальная остеокоррекция. 20+ лет опыта.">
  <meta property="og:title" content="Мио-фасциальная практика Игоря Шамшина">
  <meta property="og:image" content="igor.jpg">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect width='192' height='192' rx='40' fill='%234a8f6f'/%3E%3Ctext x='96' y='130' font-size='110' text-anchor='middle'%3E🌿%3C/text%3E%3C/svg%3E">
  
  <style>
    :root {
      --bg-main: #fbf9f6; --bg-alt: #f2efe9; --fg: #2b2a28; --muted: #8a8580;
      --accent: #4a8f6f; --accent-hover: #3b755a; --accent-soft: #e8f0ea;
      --card-bg: #ffffff; --border: #ebe6df; --radius: 16px;
      --tg: #229ED9; --wa: #25D366;
      --shadow: 0 8px 24px rgba(0,0,0,0.06);
    }
    
    /* Пресеты дизайна из админки */
    body.preset-premium { --bg-main: #f5f5f7; --bg-alt: #ebebeb; --card-bg: rgba(255, 255, 255, 0.6); --radius: 24px; --border: rgba(255,255,255,0.4); }
    body.preset-premium .card { backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px) saturate(160%); box-shadow: 0 8px 32px rgba(0,0,0,0.05); }
    body.preset-strict { --bg-main: #ffffff; --bg-alt: #fafafa; --fg: #1a1a1a; --border: #1a1a1a; --accent: #1a1a1a; --accent-soft: #f0f0f0; --radius: 0; }
    body.preset-strict .btn, body.preset-strict .card { border: 2px solid #1a1a1a; box-shadow: none; }

    html { scroll-behavior: smooth; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg-main); color: var(--fg); line-height: 1.6; -webkit-font-smoothing: antialiased; padding-bottom: 80px; transition: background 0.3s; }
    
    .section { padding: 60px 20px; width: 100%; display: flex; justify-content: center; }
    .section-alt { background-color: var(--bg-alt); }
    .container { width: 100%; max-width: 700px; }
    
    h1 { font-size: 2.2rem; line-height: 1.2; margin-bottom: 20px; color: var(--fg); }
    h2 { font-size: 1.8rem; margin-bottom: 20px; color: var(--fg); line-height: 1.3; }
    h3 { font-size: 1.2rem; margin-bottom: 10px; color: var(--fg); }
    p { font-size: 1.05rem; margin-bottom: 16px; color: #4a4845; }
    .overline { text-transform: uppercase; letter-spacing: 1px; font-size: 0.8rem; color: var(--accent); font-weight: 700; margin-bottom: 10px; display: block; }
    
    .btn-group { display: flex; flex-direction: column; gap: 12px; margin: 30px 0 15px; }
    .btn { display: flex; align-items: center; justify-content: center; width: 100%; padding: 18px 20px; border-radius: var(--radius); text-decoration: none; font-weight: 600; font-size: 1.1rem; transition: all 0.2s ease; cursor: pointer; border: none; color: #fff; }
    
    .btn-max { background: var(--accent); box-shadow: 0 6px 0 var(--accent-hover); }
    .btn-max:active { transform: translateY(6px); box-shadow: 0 0px 0 var(--accent-hover) !important; }
    .btn-tg { background: var(--tg); box-shadow: 0 6px 0 #1A7CA8; }
    .btn-tg:active { transform: translateY(6px); box-shadow: 0 0px 0 #1A7CA8 !important; }
    .btn-wa { background: var(--wa); box-shadow: 0 6px 0 #128C7E; }
    .btn-wa:active { transform: translateY(6px); box-shadow: 0 0px 0 #128C7E !important; }
    .btn-outline { background: transparent; color: var(--accent); border: 2px solid var(--accent); box-shadow: none; }
    .btn-outline:active { background: var(--accent-soft); transform: scale(0.98); }
    
    .hero-img-container { width: 100%; height: 300px; border-radius: var(--radius); background: linear-gradient(135deg, #e8f0ea 0%, #d4e4d9 100%); margin: 25px 0; box-shadow: var(--shadow); display: flex; align-items: center; justify-content: center; color: var(--accent); font-weight: 600; overflow: hidden; }
    .hero-img-container img { width: 100%; height: 100%; object-fit: cover; }
    
    .compare-grid { display: grid; grid-template-columns: 1fr; gap: 15px; margin: 25px 0; }
    .compare-card { padding: 20px; border-radius: 12px; border: 1px solid var(--border); background: var(--card-bg); }
    .compare-card h4 { margin-bottom: 15px; font-size: 1.1rem; }
    .compare-card.bad h4 { color: #a86a5a; }
    .compare-card.good h4 { color: var(--accent); }
    .compare-list { list-style: none; padding: 0; }
    .compare-list li { position: relative; padding-left: 24px; margin-bottom: 10px; font-size: 0.95rem; }
    .compare-card.bad .compare-list li::before { content: "✕"; position: absolute; left: 0; color: #a86a5a; font-weight: bold; }
    .compare-card.good .compare-list li::before { content: "✓"; position: absolute; left: 0; color: var(--accent); font-weight: bold; }
    
    .grid-2 { display: grid; grid-template-columns: 1fr; gap: 20px; margin-bottom: 20px; }
    .grid-3 { display: grid; grid-template-columns: 1fr; gap: 20px; margin-bottom: 20px; }
    .grid-4 { display: grid; grid-template-columns: 1fr; gap: 15px; margin: 25px 0; }
    
    .card { background: var(--card-bg); border-radius: var(--radius); padding: 24px; border: 1px solid var(--border); box-shadow: var(--shadow); }
    .card-icon { font-size: 2rem; margin-bottom: 15px; display: block; }
    .footer { margin-top: 40px; padding-top: 20px; border-top: 1px solid var(--border); text-align: center; font-size: 0.9rem; color: var(--muted); }
    
    /* АККОРДЕОН ЛОКАЦИЙ (Премиум) */
    .loc-item { border-bottom: 1px solid var(--border); padding: 20px 0; }
    .loc-item:last-child { border: none; }
    .loc-head { font-size: 1.2rem; font-weight: 700; cursor: pointer; display: flex; justify-content: space-between; align-items: center; color: var(--fg); transition: color 0.2s; }
    .loc-head:hover { color: var(--accent); }
    .loc-head::after { content: "▼"; font-size: 0.8rem; color: var(--accent); transition: transform 0.3s; }
    .loc-item.open .loc-head::after { transform: rotate(180deg); }
    .loc-body { max-height: 0; overflow: hidden; transition: max-height 0.5s cubic-bezier(0, 1, 0, 1); }
    .loc-item.open .loc-body { max-height: 1500px; transition: max-height 0.5s ease-in-out; padding-top: 20px; }
    .loc-img { width: 100%; height: 200px; object-fit: cover; border-radius: 12px; margin-bottom: 16px; background: var(--bg-alt); }
    .loc-features { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0; }
    .loc-feature { background: var(--accent-soft); color: var(--accent); padding: 4px 12px; border-radius: 12px; font-size: 0.85rem; font-weight: 600; }

    /* Плавающая кнопка */
    .float-btn { position: fixed; bottom: 20px; right: 20px; z-index: 900; width: 60px; height: 60px; border-radius: 50%; background: var(--accent); color: #fff; border: none; font-size: 1.6rem; cursor: pointer; box-shadow: 0 6px 20px rgba(74,143,111,0.4); display: none; align-items: center; justify-content: center; transition: transform 0.2s; }
    .float-btn.active { display: flex; }
    .float-btn:hover { transform: scale(1.05); }

    /* Cookie */
    .cookie-banner { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-top: 1px solid var(--border); padding: 16px 20px; z-index: 1100; box-shadow: 0 -4px 20px rgba(0,0,0,0.08); display: none; }
    .cookie-banner.active { display: block; }
    .cookie-inner { max-width: 900px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
    .cookie-text { flex: 1 1 300px; font-size: 0.9rem; color: var(--fg); line-height: 1.5; }
    .cookie-actions { display: flex; gap: 8px; flex-shrink: 0; }
    .cookie-actions button { padding: 10px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; border: none; font-size: 0.9rem; }
    .cookie-accept { background: var(--accent); color: #fff; }
    .cookie-decline { background: transparent; color: var(--muted); border: 1.5px solid var(--border) !important; }

    .hidden { display: none !important; }

    @media (min-width: 768px) {
      .container { max-width: 900px; }
      h1 { font-size: 2.8rem; }
      h2 { font-size: 2rem; }
      .grid-2 { grid-template-columns: 1fr 1fr; }
      .grid-3 { grid-template-columns: 1fr 1fr 1fr; }
      .grid-4 { grid-template-columns: 1fr 1fr; }
      .compare-grid { grid-template-columns: 1fr 1fr; }
      .btn-group { flex-direction: row; justify-content: center; flex-wrap: wrap; }
      .btn { width: auto; min-width: 200px; }
      .float-btn { bottom: 30px; right: 30px; }
    }
  </style>
</head>
<body>

  <section class="section" id="sec-hero">
    <div class="container">
      <span class="overline">Тест пройден</span>
      <h1 id="hero-title"></h1>
      <p id="hero-text"></p>
      <div class="hero-img-container">
        <img src="igor.jpg" alt="Игорь Шамшин" onerror="this.style.display='none';this.parentElement.innerHTML='<span>Фото специалиста</span>';" loading="lazy">
      </div>
      <div class="btn-group" id="hero-btns"></div>
    </div>
  </section>

  <section class="section section-alt" id="sec-compare">
    <div class="container">
      <h2 id="compare-title"></h2>
      <p id="compare-text"></p>
      <div class="compare-grid">
        <div class="compare-card bad">
          <h4 id="compare-bad-title"></h4>
          <ul class="compare-list" id="compare-bad-list"></ul>
        </div>
        <div class="compare-card good">
          <h4 id="compare-good-title"></h4>
          <ul class="compare-list" id="compare-good-list"></ul>
        </div>
      </div>
    </div>
  </section>

  <section class="section" id="sec-expert">
    <div class="container">
      <h2 id="expert-title"></h2>
      <p id="expert-text"></p>
      <div class="grid-3" id="expert-cards"></div>
    </div>
  </section>

  <section class="section section-alt" id="sec-locations">
    <div class="container">
      <h2 id="loc-title"></h2>
      <div class="card" id="loc-list"></div>
    </div>
  </section>

  <section class="section" id="sec-pricing">
    <div class="container">
      <h2 id="pricing-title"></h2>
      <div class="card" style="text-align: center;">
        <h3 id="pricing-name"></h3>
        <p style="font-size: 2rem; font-weight: 700; color: var(--accent); margin: 10px 0;" id="pricing-price"></p>
        <p id="pricing-desc"></p>
      </div>
    </div>
  </section>

  <section class="section section-alt" id="sec-gift">
    <div class="container">
      <h2 id="gift-title" style="text-align: center;"></h2>
      <div class="card" style="border: 2px dashed var(--accent); background: var(--accent-soft); text-align: center;">
        <span class="card-icon">🎁</span>
        <p id="gift-text" style="font-size: 1.1rem; font-weight: 500;"></p>
        <div class="btn-group" id="gift-btns" style="justify-content: center;"></div>
      </div>
    </div>
  </section>

  <section class="section" id="sec-news">
    <div class="container">
      <h2 id="news-title"></h2>
      <div class="grid-3" id="news-list"></div>
    </div>
  </section>

  <section class="section section-alt" id="sec-cases">
    <div class="container">
      <h2 id="cases-title"></h2>
      <div class="grid-3" id="cases-list"></div>
    </div>
  </section>

  <section class="section" id="sec-contacts">
    <div class="container" style="text-align: center;">
      <h2 style="margin-bottom: 30px;">Связаться со мной</h2>
      <div class="btn-group" id="contacts-btns"></div>
      <div class="footer">
        <p id="footer-text"></p>
      </div>
    </div>
  </section>

  <button class="float-btn" id="float-btn">💬</button>

  <div class="cookie-banner" id="cookie-banner">
    <div class="cookie-inner">
      <div class="cookie-text" id="cookie-text"></div>
      <div class="cookie-actions">
        <button class="cookie-decline" id="btn-decline"></button>
        <button class="cookie-accept" id="btn-accept"></button>
      </div>
    </div>
  </div>

  <script src="content.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      if (typeof CONTENT === "undefined") return;
      const C = CONTENT;
      const L = C.links || {}, S = C.settings || {}, LD = C.landing || {};
      
      // --- Тема и Пресеты ---
      document.documentElement.style.setProperty('--accent', C.theme.primary);
      document.documentElement.style.setProperty('--tg', C.theme.tg);
      document.documentElement.style.setProperty('--wa', C.theme.wa);
      if (C.theme.preset) document.body.classList.add('preset-' + C.theme.preset);

      const $ = id => document.getElementById(id);
      const setT = (id, val) => { if ($(id)) $(id).textContent = val || ''; };
      const show = (id, cond) => { if ($(id)) $(id).classList.toggle('hidden', !cond); };
      
      const getImg = (src) => {
        if (!src) return "";
        if (src.startsWith('http') || src.startsWith('data:') || src.startsWith('/')) return src;
        return (L.imgBase || '') + src;
      };

      const createBtn = (txt, href, cls) => {
        if (!href) return null;
        const a = document.createElement('a');
        a.href = href; a.textContent = txt; a.className = 'btn ' + cls;
        a.target = '_blank'; a.rel = 'noopener';
        return a;
      };

      // --- Рендер секций ---

      // Hero
      setT('hero-title', LD.heroTitle); setT('hero-text', LD.heroText);
      const heroBtns = $('hero-btns');
      [createBtn('Написать в MAX', L.max, 'btn-max'), createBtn('Написать в Telegram', L.tg, 'btn-tg'), createBtn('Написать в WhatsApp', L.wa, 'btn-wa')].forEach(b => b && heroBtns.appendChild(b));
      show('sec-hero', !!(LD.heroTitle || heroBtns.children.length));

      // Compare
      if (S.showCompare && LD.compareBadList && LD.compareBadList.length > 0) {
        show('sec-compare', true);
        setT('compare-title', LD.compareTitle); setT('compare-text', LD.compareText);
        setT('compare-bad-title', LD.compareBadTitle); setT('compare-good-title', LD.compareGoodTitle);
        $('compare-bad-list').innerHTML = LD.compareBadList.map(t => `<li>${t}</li>`).join('');
        $('compare-good-list').innerHTML = LD.compareGoodList.map(t => `<li>${t}</li>`).join('');
      }

      // Expert
      if (S.showExpert && LD.expertCards && LD.expertCards.length > 0) {
        show('sec-expert', true);
        setT('expert-title', LD.expertTitle); setT('expert-text', LD.expertText);
        const exContainer = $('expert-cards'); exContainer.innerHTML = '';
        LD.expertCards.forEach(c => {
          const card = document.createElement('div'); card.className = 'card';
          card.innerHTML = `<span class="card-icon">${c.icon || '✨'}</span><h3>${c.title}</h3><p style="font-size:0.95rem;">${c.text}</p>`;
          exContainer.appendChild(card);
        });
      }

      // Locations (Аккордеон)
      if (S.showLocations && LD.locationsCards && LD.locationsCards.length > 0) {
        show('sec-locations', true);
        setT('loc-title', LD.locationsTitle);
        const locList = $('loc-list'); locList.innerHTML = '';
        LD.locationsCards.forEach(loc => {
          const div = document.createElement('div'); div.className = 'loc-item';
          div.innerHTML = `
            <div class="loc-head">${loc.city} — ${loc.title}</div>
            <div class="loc-body">
              ${loc.img ? `<img src="${getImg(loc.img)}" class="loc-img" loading="lazy">` : ''}
              <p>${loc.text}</p>
              <p style="color:var(--accent); font-weight:700; font-size:1.2rem;">${loc.price}</p>
              <div class="btn-group" style="justify-content: flex-start; margin-top: 15px;">
                <button class="btn btn-max" style="width:auto; padding:12px 24px; box-shadow:none;" onclick="document.getElementById('sec-contacts').scrollIntoView({behavior:'smooth'})">Записаться</button>
                ${loc.mapLink ? `<a href="${loc.mapLink}" target="_blank" class="btn btn-outline" style="width:auto; padding:12px 24px;">Маршрут</a>` : ''}
              </div>
            </div>
          `;
          div.querySelector('.loc-head').addEventListener('click', () => div.classList.toggle('open'));
          locList.appendChild(div);
        });
      }

      // Pricing
      if (S.showPricing && LD.pricingName) {
        show('sec-pricing', true);
        setT('pricing-title', LD.pricingTitle); setT('pricing-name', LD.pricingName);
        setT('pricing-price', LD.pricingPrice); setT('pricing-desc', LD.pricingDesc);
      }

      // Gift
      if (S.showGift && LD.giftTitle) {
        show('sec-gift', true);
        setT('gift-title', LD.giftTitle); setT('gift-text', LD.giftText);
        const gb = $('gift-btns');
        [createBtn('Получить в MAX', L.max, 'btn-max'), createBtn('В Telegram', L.tg, 'btn-tg'), createBtn('В WhatsApp', L.wa, 'btn-wa')].forEach(b => b && gb.appendChild(b));
      }

      // News
      if (S.showNews && LD.newsCards && LD.newsCards.length > 0) {
        show('sec-news', true);
        setT('news-title', LD.newsTitle);
        const nContainer = $('news-list'); nContainer.innerHTML = '';
        LD.newsCards.forEach(n => {
          const card = document.createElement('div'); card.className = 'card';
          card.innerHTML = `<small style="color:var(--muted); font-weight:600;">${n.date}</small><h3 style="margin:8px 0;">${n.title}</h3><p style="margin:0; font-size:0.95rem;">${n.text}</p>`;
          nContainer.appendChild(card);
        });
      }

      // Cases
      if (S.showCases && LD.casesCards && LD.casesCards.length > 0) {
        show('sec-cases', true);
        setT('cases-title', LD.casesTitle);
        const cContainer = $('cases-list'); cContainer.innerHTML = '';
        LD.casesCards.forEach(c => {
          const card = document.createElement('div'); card.className = 'card';
          card.innerHTML = `<h3>${c.title}</h3><p style="font-size:0.95rem;"><b>Жалобы:</b> ${c.complaints}</p><p style="font-size:0.95rem; margin:0;"><b>Результат:</b> ${c.result}</p>`;
          cContainer.appendChild(card);
        });
      }

      // Contacts
      show('sec-contacts', !!(L.max || L.tg || L.wa || L.phone));
      const cBtns = $('contacts-btns');
      [createBtn('Написать в MAX', L.max, 'btn-max'), createBtn('Написать в Telegram', L.tg, 'btn-tg'), createBtn('Написать в WhatsApp', L.wa, 'btn-wa'), createBtn('Позвонить', L.phone, 'btn-outline')].forEach(b => b && cBtns.appendChild(b));

      // Footer
      if (LD.footerText) {
        setT('footer-text', LD.footerText);
      }

      // Float Button
      if (S.showFloatingButton) {
        const fb = $('float-btn');
        fb.classList.add('active');
        fb.addEventListener('click', () => $('sec-contacts').scrollIntoView({behavior: 'smooth'}));
      }

      // Cookie
      if (S.dataCollectionEnabled && !localStorage.getItem('cookieChoice') && LD.cookieBanner) {
        const banner = $('cookie-banner');
        banner.classList.add('active');
        setT('cookie-text', LD.cookieBanner.text);
        $('btn-accept').textContent = LD.cookieBanner.accept || 'Принять';
        $('btn-decline').textContent = LD.cookieBanner.decline || 'Отклонить';
        $('btn-accept').onclick = () => { localStorage.setItem('cookieChoice', 'accept'); banner.classList.remove('active'); };
        $('btn-decline').onclick = () => { localStorage.setItem('cookieChoice', 'decline'); banner.classList.remove('active'); };
      }
    });
  </script>
</body>
</html>
